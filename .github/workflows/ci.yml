# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  pull_request:
    branches: ["main"]
  # Allow running the checks manually as well.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Run the linter with --fix and fail if it would change any files.
      # This enforces that linting produces no code changes.
      - name: Lint (no code changes allowed)
        run: |
          npx eslint . --fix
          git diff --exit-code

  build:
    name: Build
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Share the built plugin so the e2e job can load it into Obsidian.
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            main.js
            styles.css
          if-no-files-found: error

  unit:
    name: Unit tests
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

  e2e:
    name: E2E tests
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The e2e tests load the built plugin (main.js) into Obsidian.
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output

      # Cache downloaded Obsidian versions to speed up subsequent runs.
      - name: Cache Obsidian
        uses: actions/cache@v4
        with:
          path: .obsidian-cache
          key: obsidian-cache-${{ runner.os }}-${{ hashFiles('wdio.conf.ts') }}
          restore-keys: |
            obsidian-cache-${{ runner.os }}-

      # Obsidian is an Electron app, so on Linux runners it needs a virtual
      # graphics stack. xvfb provides a virtual display and herbstluftwm acts
      # as a window manager (some Obsidian features need one).
      - name: Setup virtual graphics
        run: |
          sudo apt-get update -q
          sudo apt-get install -q -y herbstluftwm x11-xserver-utils xvfb
          export DISPLAY=:99
          echo "DISPLAY=$DISPLAY" >> "$GITHUB_ENV"
          Xvfb $DISPLAY -screen 0 1280x1024x24 +extension GLX -noreset &
          sleep 1
          herbstluftwm &
          sleep 1

      - name: E2E tests
        run: npm run e2e
